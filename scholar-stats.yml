name: Update Google Scholar Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update-scholar-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install scholarly requests "bibtexparser<2.0"
      - name: Update Gist
        env:
          SCHOLAR_ID: "ShAefLUAAAAJ"
          GIST_ID: "3ffc25cc308f54cb2aa77e193fa2b6af"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python -c "
          import os
          import json
          import requests
          from scholarly import scholarly
          import time
          # --- 修改开始：启用免费代理 ---
          print('Setting up proxy...')
          scholarly.use_proxy('free')
          # --- 修改结束 ---
          # 1. 获取 Scholar 数据
          try:
              print(f'Searching for author: {os.environ[\"SCHOLAR_ID\"]}')
              author = scholarly.search_author_id(os.environ['SCHOLAR_ID'])
              
              # 填充数据
              scholarly.fill(author, sections=['indices'])
              
              citations = author.get('citedby', 0)
              print(f'Found {citations} citations.')
          except Exception as e:
              print(f'Error fetching scholar data: {e}')
              exit(1)
          # 2. 构造 Shields.io JSON
          content = {
              'schemaVersion': 1,
              'label': 'Citations',
              'message': str(citations),
              'color': 'orange',
              'cacheSeconds': 3600
          }
          # 3. 更新 Gist
          gist_id = os.environ['GIST_ID']
          token = os.environ['GH_TOKEN']
          filename = 'scholar.json'
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          data = {
              'files': {
                  filename: {
                      'content': json.dumps(content)
                  }
              }
          }
          r = requests.patch(f'https://api.github.com/gists/{gist_id}', headers=headers, json=data)
          if r.status_code == 200:
              print('Gist updated successfully!')
          else:
              print(f'Failed to update Gist: {r.status_code} {r.text}')
              exit(1)
          "
